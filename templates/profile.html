<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - Plant Disease Detector</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="icon" href="/favicon.ico">
</head>
<body class="bg-green-50 text-gray-800">
  <div class="min-h-screen flex">
    <aside class="w-64 bg-green-800 text-white p-6 hidden md:block">
      <div class="text-xl font-bold mb-6">Plant Disease Detector</div>
      <nav class="space-y-2 text-sm">
        <a class="block px-3 py-2 rounded hover:bg-green-700" href="/dashboard">Dashboard</a>
        <a class="block px-3 py-2 rounded hover:bg-green-700" href="/analysis">AI Analysis</a>
        <a class="block px-3 py-2 rounded hover:bg-green-700" href="/results">AI Results</a>
        <a class="block px-3 py-2 rounded bg-green-700" href="/profile">Profile</a>
        <a id="adminLink" class="hidden block px-3 py-2 rounded hover:bg-green-700" href="/admin">Admin</a>
      </nav>
    </aside>

    <main class="flex-1">
      <nav class="bg-green-700 shadow-md p-4 flex justify-between items-center">
        <h1 class="text-white text-2xl font-bold">Profile</h1>
        <button id="logoutBtn" class="bg-white text-green-700 px-4 py-2 rounded-full font-semibold hover:bg-green-100">
          Logout
        </button>
      </nav>

      <section class="max-w-3xl mx-auto px-6 py-10">
        <div class="bg-white rounded-xl shadow p-6">
          <h2 class="text-xl font-bold text-green-700 mb-4">Edit your profile</h2>

          <div class="grid gap-4">
            <div>
              <label class="block text-sm font-semibold mb-1">Full name</label>
              <input id="nameInput" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-400" />
            </div>
            <div>
              <label class="block text-sm font-semibold mb-1">Email</label>
              <input id="emailInput" type="email" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-400" />
            </div>

            <div class="flex gap-3 pt-2">
              <button id="saveBtn" class="bg-green-700 text-white px-5 py-2 rounded-lg font-semibold hover:bg-green-800">
                Save changes
              </button>
              <button id="refreshBtn" class="bg-gray-100 px-5 py-2 rounded-lg font-semibold hover:bg-gray-200">
                Reload
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const userId = localStorage.getItem("user_id");
    const isAdmin = localStorage.getItem("is_admin") === "1";
    if (!userId) window.location.href = "/";
    if (isAdmin) document.getElementById("adminLink")?.classList.remove("hidden");

    const nameInput = document.getElementById("nameInput");
    const emailInput = document.getElementById("emailInput");

    async function loadProfile() {
      const res = await fetch(`/users/${encodeURIComponent(userId)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data?.detail || "Failed to load profile");
      nameInput.value = data?.name || "";
      emailInput.value = data?.email || "";
    }

    document.getElementById("refreshBtn").onclick = async () => {
      try { await loadProfile(); } catch (e) { Swal.fire("Error", String(e), "error"); }
    };

    document.getElementById("saveBtn").onclick = async () => {
      const payload = {
        display_name: nameInput.value.trim(),
        email: emailInput.value.trim()
      };
      const res = await fetch(`/users/${encodeURIComponent(userId)}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        Swal.fire("Error", data?.detail || "Failed to update profile", "error");
        return;
      }
      localStorage.setItem("user_name", payload.display_name || localStorage.getItem("user_name") || "");
      localStorage.setItem("user_email", payload.email || localStorage.getItem("user_email") || "");
      Swal.fire("Saved", "Your profile has been updated.", "success");
    };

    document.getElementById("logoutBtn").onclick = () => {
      localStorage.removeItem("user_id");
      localStorage.removeItem("user_name");
      localStorage.removeItem("user_email");
      localStorage.removeItem("is_admin");
      window.location.href = "/";
    };

    loadProfile().catch(e => Swal.fire("Error", String(e), "error"));
  </script>
</body>
</html>
