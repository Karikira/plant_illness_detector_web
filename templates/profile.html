<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - Plant Disease Detector</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="icon" href="/favicon.ico">
</head>
<body class="bg-green-50 text-gray-800">
  <div class="min-h-screen flex">
    <aside class="w-64 bg-green-800 text-white p-6 hidden md:block">
      <div class="flex items-center gap-2 mb-6">
        <img src="https://via.placeholder.com/32x32.png?text=PD" alt="Logo" class="w-8 h-8 rounded-full" />
        <span class="text-xl font-bold">Plant Disease Detector</span>
      </div>
      <nav class="space-y-2 text-sm">
        <a class="block px-3 py-2 rounded hover:bg-green-700" href="/dashboard">Dashboard</a>
        <a class="block px-3 py-2 rounded hover:bg-green-700" href="/analysis">AI Analysis</a>
        <a class="block px-3 py-2 rounded hover:bg-green-700" href="/results">AI Results</a>
        <a class="block px-3 py-2 rounded hover:bg-green-700" href="/profile">Profile</a>
        <a id="adminLink" class="hidden block px-3 py-2 rounded hover:bg-green-700" href="/admin">Admin</a>
      </nav>
    </aside>

    <main class="flex-1">
      <nav class="bg-white shadow-md py-3">
        <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <img src="/logo.png" onerror="this.onerror=null;this.src='https://via.placeholder.com/32x32?text=PD'" class="w-8 h-8 rounded-full" alt="Logo" />
            <span class="font-bold text-green-800">Plant Disease Detector</span>
          </div>
          <div class="relative">
            <button id="userDropdownBtn" class="relative w-10 h-10 rounded-full overflow-hidden border-2 border-green-600 bg-white p-0">
              <img id="userAvatar" src="https://via.placeholder.com/40?text=US" alt="Profile" class="w-full h-full object-cover" />
            </button>
            <div id="userDropdown" class="hidden absolute right-0 mt-2 w-44 bg-white shadow-lg rounded-md border text-sm">
              <button id="navEditProfile" class="block w-full px-4 py-2 text-left hover:bg-green-50">Edit Profile</button>
              <button id="navAbout" class="block w-full px-4 py-2 text-left hover:bg-green-50">About</button>
              <button id="logoutBtn" class="block w-full px-4 py-2 text-left hover:bg-green-50">Logout</button>
            </div>
          </div>
        </div>
      </nav>
      <div class="p-6">
      <div class="max-w-3xl mx-auto">
        <h1 class="text-3xl font-bold text-green-700 mb-6">Edit your profile</h1>

        <div class="bg-white rounded-xl shadow p-6">
          <div class="grid gap-4">
            <div class="flex gap-4 items-start">
              <div class="w-28 h-28 rounded-full overflow-hidden border bg-gray-100">
                <img id="avatarPreview" src="https://ui-avatars.com/api/?name=User" alt="avatar" class="w-full h-full object-cover" />
              </div>
              <div class="flex-1">
                <label class="block text-sm font-semibold mb-1">Profile picture</label>
                <input id="avatarInput" type="file" accept="image/*" class="w-full text-sm" />
              </div>
            </div>

            <div>
              <label class="block text-sm font-semibold mb-1">Full name</label>
              <input id="fullNameInput" placeholder="" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-400" />
            </div>
            <div>
              <label class="block text-sm font-semibold mb-1">Nickname (dashboard name)</label>
              <input id="nicknameInput" placeholder="" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-400" />
            </div>
            <div>
              <label class="block text-sm font-semibold mb-1">Email</label>
              <input id="emailInput" type="email" placeholder="" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-400" />
            </div>
            <div>
              <label class="block text-sm font-semibold mb-1">Password</label>
              <input id="passwordInput" type="password" placeholder="Leave empty to keep existing" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-400" />
            </div>
            <div>
              <label class="block text-sm font-semibold mb-1">Confirm Password</label>
              <input id="passwordConfirmInput" type="password" placeholder="Repeat password" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-400" />
            </div>

            <div class="flex gap-3 pt-2">
              <button id="saveBtn" class="bg-green-700 text-white px-5 py-2 rounded-lg font-semibold hover:bg-green-800">Save changes</button>
              <button id="refreshBtn" class="bg-gray-100 px-5 py-2 rounded-lg font-semibold hover:bg-gray-200">Reload</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const userId = localStorage.getItem("user_id");
    const isAdmin = localStorage.getItem("is_admin") === "1";
    if (!userId) window.location.href = "/";
    if (isAdmin) document.getElementById("adminLink")?.classList.remove("hidden");

    const userAvatarImage = document.getElementById("userAvatar");
    const savedAvatar = localStorage.getItem("profile_avatar");
    if (savedAvatar && userAvatarImage) {
      userAvatarImage.src = savedAvatar;
    }

    const fullNameInput = document.getElementById("fullNameInput");
    const nicknameInput = document.getElementById("nicknameInput");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const passwordConfirmInput = document.getElementById("passwordConfirmInput");
    const avatarInput = document.getElementById("avatarInput");
    const avatarPreview = document.getElementById("avatarPreview");

    avatarInput.addEventListener("change", () => {
      const file = avatarInput.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        avatarPreview.src = String(reader.result);
        localStorage.setItem("profile_avatar", String(reader.result));
      };
      reader.readAsDataURL(file);
    });

    async function loadProfile() {
      const res = await fetch(`/users/${encodeURIComponent(userId)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data?.detail || "Failed to load profile");

      const fullName = data?.display_name || data?.nickname || "";
      const nickname = data?.nickname || data?.display_name || "";
      const email = data?.email || "";
      const savedAvatar = data?.profile_picture || localStorage.getItem("profile_avatar");

      fullNameInput.value = "";
      fullNameInput.placeholder = fullName;
      nicknameInput.value = "";
      nicknameInput.placeholder = nickname;
      emailInput.value = "";
      emailInput.placeholder = email;

      if (savedAvatar) {
        avatarPreview.src = savedAvatar;
        userAvatarImage.src = savedAvatar;
      } else if (nickname) {
        const generated = `https://ui-avatars.com/api/?name=${encodeURIComponent(nickname)}&background=ffffff&color=008000`;
        avatarPreview.src = generated;
        userAvatarImage.src = generated;
      }

      // fallback to placeholder if none available
      if (!userAvatarImage.src || userAvatarImage.src.includes('data:')) {
        userAvatarImage.src = 'https://via.placeholder.com/40?text=US';
      }
    }

    document.getElementById("refreshBtn").onclick = async () => {
      try { await loadProfile(); } catch (e) { Swal.fire("Error", String(e), "error"); }
    };

    document.getElementById("saveBtn").onclick = async () => {
      const fullName = fullNameInput.value.trim();
      const nickname = nicknameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      const passwordConfirm = passwordConfirmInput.value.trim();
      const profile_picture = avatarPreview.src;

      if (password && password !== passwordConfirm) {
        Swal.fire("Error", "Passwords do not match", "error");
        return;
      }

      const payload = {};
      if (fullName) payload.display_name = fullName;
      if (nickname) payload.nickname = nickname;
      if (email) payload.email = email;
      if (password) payload.password = password;
      payload.profile_picture = profile_picture;

      const res = await fetch(`/users/${encodeURIComponent(userId)}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        Swal.fire("Error", data?.detail || "Failed to update profile", "error");
        return;
      }

      if (nickname) localStorage.setItem("user_name", nickname);
      else if (fullName) localStorage.setItem("user_name", fullName);
      if (email) localStorage.setItem("user_email", email);
      localStorage.setItem("profile_avatar", profile_picture);

      passwordInput.value = "";
      passwordConfirmInput.value = "";
      Swal.fire("Saved", "Your profile has been updated.", "success");
      loadProfile().catch(() => {});
    };

    const userDropdownBtn = document.getElementById("userDropdownBtn");
    const userDropdown = document.getElementById("userDropdown");
    const navEditProfile = document.getElementById("navEditProfile");
    const navAbout = document.getElementById("navAbout");

    userDropdownBtn?.addEventListener("click", () => {
      userDropdown.classList.toggle("hidden");
    });

    window.addEventListener("click", (e) => {
      if (!userDropdown.contains(e.target) && !userDropdownBtn.contains(e.target)) {
        userDropdown.classList.add("hidden");
      }
    });

    navEditProfile?.addEventListener("click", () => {
      window.location.href = "/profile";
    });

    navAbout?.addEventListener("click", () => {
      Swal.fire({
        title: "About",
        html: "Plant Disease Detector is a modern AI tool for farming and gardening.",
        icon: "info",
      });
    });

    const logoutFn = () => {
      localStorage.removeItem("user_id");
      localStorage.removeItem("user_name");
      localStorage.removeItem("user_email");
      localStorage.removeItem("is_admin");
      window.location.href = "/";
    };

    document.querySelectorAll("#logoutBtn").forEach(btn => btn.addEventListener("click", logoutFn));

    loadProfile().catch(e => Swal.fire("Error", String(e), "error"));
  </script>
</body>
</html>
