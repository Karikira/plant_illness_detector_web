<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Results - Plant Disease Detector</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="icon" href="/favicon.ico">
</head>
<body class="bg-green-50 text-gray-800">
  <div class="min-h-screen flex">
    <aside class="w-64 bg-green-800 text-white p-6 hidden md:block">
      <div class="text-xl font-bold mb-6">Plant Disease Detector</div>
      <nav class="space-y-2 text-sm">
        <a class="block px-3 py-2 rounded hover:bg-green-700" href="/dashboard">Dashboard</a>
        <a class="block px-3 py-2 rounded hover:bg-green-700" href="/analysis">AI Analysis</a>
        <a class="block px-3 py-2 rounded bg-green-700" href="/results">AI Results</a>
        <a class="block px-3 py-2 rounded hover:bg-green-700" href="/profile">Profile</a>
        <a id="adminLink" class="hidden block px-3 py-2 rounded hover:bg-green-700" href="/admin">Admin</a>
      </nav>
    </aside>

    <main class="flex-1">
      <nav class="bg-green-700 shadow-md p-4 flex justify-between items-center">
        <h1 class="text-white text-2xl font-bold">AI Results</h1>
        <button id="logoutBtn" class="bg-white text-green-700 px-4 py-2 rounded-full font-semibold hover:bg-green-100">
          Logout
        </button>
      </nav>

      <section class="max-w-6xl mx-auto px-6 py-10">
        <div class="bg-white rounded-xl shadow p-6">
          <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
            <div>
              <h2 class="text-xl font-bold text-green-700">Your detection history</h2>
              <p class="text-gray-600 text-sm mt-1">Sorted by date. Click an item to view full details.</p>
            </div>
            <button id="refreshBtn" class="bg-gray-100 px-5 py-2 rounded-lg font-semibold hover:bg-gray-200">
              Refresh
            </button>
          </div>

          <div id="list" class="mt-6 divide-y"></div>
          <div id="empty" class="hidden mt-6 text-gray-600">No results yet. Go to <a class="text-green-700 font-semibold hover:underline" href="/analysis">AI Analysis</a> to run one.</div>
        </div>
      </section>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal" class="fixed inset-0 hidden items-center justify-center bg-black/50 p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl">
      <div class="flex items-center justify-between p-4 border-b">
        <div class="font-bold text-green-700">Result details</div>
        <button id="closeModal" class="px-3 py-1 rounded hover:bg-gray-100">✕</button>
      </div>
      <div class="p-4">
        <div class="text-sm text-gray-600" id="modalMeta"></div>
        <pre id="modalBody" class="mt-3 text-sm whitespace-pre-wrap break-words bg-green-50 border rounded-lg p-3"></pre>
      </div>
    </div>
  </div>

  <script>
    const userId = localStorage.getItem("user_id");
    const isAdmin = localStorage.getItem("is_admin") === "1";
    if (!userId) window.location.href = "/";
    if (isAdmin) document.getElementById("adminLink")?.classList.remove("hidden");

    const listEl = document.getElementById("list");
    const emptyEl = document.getElementById("empty");

    const modal = document.getElementById("modal");
    const closeModal = document.getElementById("closeModal");
    const modalMeta = document.getElementById("modalMeta");
    const modalBody = document.getElementById("modalBody");

    function openModal(item) {
      const created = item?.created_at || "";
      modalMeta.textContent = `Date: ${created}`;
      modalBody.textContent = JSON.stringify({
        name: item?.name,
        illness: item?.illness,
        treatment: item?.treatment,
        prevention: item?.prevention,
        image_filename: item?.image_filename,
        raw_result: item?.raw_result
      }, null, 2);
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function hideModal() {
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    closeModal.onclick = hideModal;
    modal.addEventListener("click", (e) => { if (e.target === modal) hideModal(); });

    function summary(item) {
      const plant = item?.name || "Unknown plant";
      const illness = item?.illness || "Unknown";
      return `${plant} — ${illness}`;
    }

    async function loadHistory() {
      listEl.innerHTML = "";
      emptyEl.classList.add("hidden");
      const res = await fetch(`/history/${encodeURIComponent(userId)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data?.detail || "Failed to load history");
      const rows = Array.isArray(data) ? data : [];
      if (!rows.length) {
        emptyEl.classList.remove("hidden");
        return;
      }
      for (const item of rows) {
        const created = item?.created_at ? new Date(item.created_at).toLocaleString() : "";
        const el = document.createElement("button");
        el.className = "w-full text-left py-4 hover:bg-green-50 px-2 rounded transition";
        el.innerHTML = `
          <div class="flex items-start justify-between gap-4">
            <div>
              <div class="font-semibold text-gray-900">${summary(item)}</div>
              <div class="text-sm text-gray-600 mt-1">${item?.treatment ? String(item.treatment).slice(0, 80) + (String(item.treatment).length > 80 ? "…" : "") : "No treatment info"}</div>
            </div>
            <div class="text-xs text-gray-500 whitespace-nowrap">${created}</div>
          </div>
        `;
        el.onclick = () => openModal(item);
        listEl.appendChild(el);
      }
    }

    document.getElementById("refreshBtn").onclick = () => loadHistory().catch(e => Swal.fire("Error", String(e), "error"));
    document.getElementById("logoutBtn").onclick = () => {
      localStorage.removeItem("user_id");
      localStorage.removeItem("user_name");
      localStorage.removeItem("user_email");
      localStorage.removeItem("is_admin");
      window.location.href = "/";
    };

    loadHistory().catch(e => Swal.fire("Error", String(e), "error"));
  </script>
</body>
</html>
