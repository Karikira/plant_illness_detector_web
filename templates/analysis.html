<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Analysis - Plant Disease Detector</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="icon" href="/favicon.ico">
</head>
<body class="bg-green-50 text-gray-800">
  <div class="min-h-screen flex">
    <aside class="w-64 bg-green-800 text-white p-6 hidden md:block">
      <div class="text-xl font-bold mb-6">Plant Disease Detector</div>
      <nav class="space-y-2 text-sm">
        <a class="block px-3 py-2 rounded hover:bg-green-700" href="/dashboard">Dashboard</a>
        <a class="block px-3 py-2 rounded bg-green-700" href="/analysis">AI Analysis</a>
        <a class="block px-3 py-2 rounded hover:bg-green-700" href="/results">AI Results</a>
        <a class="block px-3 py-2 rounded hover:bg-green-700" href="/profile">Profile</a>
        <a id="adminLink" class="hidden block px-3 py-2 rounded hover:bg-green-700" href="/admin">Admin</a>
      </nav>
    </aside>

    <main class="flex-1">
      <nav class="bg-green-700 shadow-md p-4 flex justify-between items-center">
        <h1 class="text-white text-2xl font-bold">AI Analysis</h1>
        <button id="logoutBtn" class="bg-white text-green-700 px-4 py-2 rounded-full font-semibold hover:bg-green-100">
          Logout
        </button>
      </nav>

      <section class="max-w-5xl mx-auto px-6 py-10">
        <div class="bg-white rounded-xl shadow p-6">
          <h2 class="text-xl font-bold text-green-700">Upload an image</h2>
          <p class="text-gray-600 text-sm mt-1">The AI will return plant name, illness, treatment, and prevention. This run is also saved to your results.</p>

          <div class="mt-6 grid md:grid-cols-2 gap-6">
            <div>
              <input id="fileInput" type="file" accept="image/*" class="w-full" />
              <div class="mt-4">
                <img id="preview" class="hidden w-full rounded-lg border" />
              </div>
              <button id="analyzeBtn" class="mt-4 bg-green-700 text-white px-5 py-2 rounded-lg font-semibold hover:bg-green-800 disabled:opacity-50" disabled>
                Run analysis
              </button>
            </div>

            <div>
              <div class="border rounded-lg p-4 bg-green-50">
                <div class="font-semibold text-green-800">Latest result</div>
                <pre id="resultBox" class="mt-2 text-sm whitespace-pre-wrap break-words text-gray-800">No result yet.</pre>
              </div>
              <a href="/results" class="inline-block mt-4 text-green-700 font-semibold hover:underline">Go to AI Results →</a>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const userId = localStorage.getItem("user_id");
    const isAdmin = localStorage.getItem("is_admin") === "1";
    if (!userId) window.location.href = "/";
    if (isAdmin) document.getElementById("adminLink")?.classList.remove("hidden");

    const fileInput = document.getElementById("fileInput");
    const preview = document.getElementById("preview");
    const analyzeBtn = document.getElementById("analyzeBtn");
    const resultBox = document.getElementById("resultBox");

    fileInput.addEventListener("change", () => {
      const file = fileInput.files?.[0];
      if (!file) {
        preview.classList.add("hidden");
        analyzeBtn.disabled = true;
        return;
      }
      analyzeBtn.disabled = false;
      preview.src = URL.createObjectURL(file);
      preview.classList.remove("hidden");
    });

    analyzeBtn.addEventListener("click", async () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      analyzeBtn.disabled = true;
      analyzeBtn.textContent = "Analyzing...";
      try {
        const form = new FormData();
        form.append("user_id", userId);
        form.append("file", file);
        const res = await fetch("/analyze", { method: "POST", body: form });
        let data;
        const text = await res.text();
        try {
          data = JSON.parse(text);
        } catch {
          data = { detail: text };
        }
        if (!res.ok) throw new Error(data?.detail || "Analysis failed");
        resultBox.textContent = JSON.stringify(data?.result || data, null, 2);
        Swal.fire("Success", "Analysis complete and saved to your results.", "success");
      } catch (e) {
        Swal.fire("Error", String(e), "error");
      } finally {
        analyzeBtn.disabled = false;
        analyzeBtn.textContent = "Run analysis";
      }
    });

    document.getElementById("logoutBtn").onclick = () => {
      localStorage.removeItem("user_id");
      localStorage.removeItem("user_name");
      localStorage.removeItem("user_email");
      localStorage.removeItem("is_admin");
      window.location.href = "/";
    };
  </script>
</body>
</html>
